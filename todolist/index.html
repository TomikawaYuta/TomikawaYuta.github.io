<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Kelola TOS & SLA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0b12;--surface:#12121c;--card:#181825;--bd:#23233a;
  --text:#e2e2f0;--muted:#9494b8;--dim:#5c5c7a;
  --accent:#6c6ff5;--accent2:#a78bfa;
  --green:#34d399;--red:#f87171;--gold:#fbbf24;--blue:#60a5fa;--teal:#2dd4bf;
  --font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
}
[data-theme="light"]{
  --bg:#f4f4f9;--surface:#eaeaef;--card:#dfdfec;--bd:#c5c5d4;
  --text:#15152a;--muted:#6a6a88;--dim:#9090aa;
  --accent:#5356d1;--accent2:#8b5cf6;
  --green:#059669;--red:#dc2626;--gold:#ca8a04;--blue:#2563eb;--teal:#0d9488;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;transition:background .25s,color .25s}
input,button,select,textarea{font-family:var(--font)}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

/* ── Modal ── */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal.hidden{display:none}
.modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.modal-box{position:relative;background:var(--surface);border:1px solid var(--bd);border-radius:12px;width:100%;max-width:480px;max-height:90vh;display:flex;flex-direction:column;z-index:1;transition:background .25s}
.modal-head{display:flex;align-items:center;padding:16px 20px 12px;border-bottom:1px solid var(--bd);transition:border-color .25s}
.modal-title{font-size:.9rem;font-weight:800;flex:1}
.modal-close{width:26px;height:26px;border-radius:5px;border:1px solid var(--bd);background:var(--card);color:var(--muted);font-size:.8rem;display:flex;align-items:center;justify-content:center;transition:all .15s}
.modal-close:hover{background:var(--red);border-color:var(--red);color:#fff}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;flex:1;min-height:0}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.form-input,.form-select,.form-textarea{padding:8px 12px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--text);font-size:.82rem;outline:none;transition:border-color .15s,background .25s;width:100%}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.form-textarea{resize:vertical;min-height:80px;max-height:300px}
.form-select option{background:var(--card)}
.modal-foot{flex-shrink:0;display:flex;gap:8px;padding:12px 20px 18px;justify-content:flex-end;border-top:1px solid var(--bd)}
.btn-cancel{padding:8px 16px;border-radius:7px;border:1px solid var(--bd);background:transparent;color:var(--muted);font-size:.78rem;font-weight:600;transition:all .15s}
.btn-cancel:hover{border-color:var(--text);color:var(--text)}
.btn-save{padding:8px 18px;border-radius:7px;border:none;background:var(--accent);color:#fff;font-size:.78rem;font-weight:700;transition:background .15s}
.btn-save:hover{background:var(--accent2)}

/* ── Nav ── */
.nav{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--bd);transition:background .25s,border-color .25s}
.nav-title{font-size:.82rem;font-weight:700}
.nav-spacer{flex:1}
.theme-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,color .2s;font-size:14px;line-height:1}
.theme-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── App ── */
.app{flex:1;display:flex;overflow:hidden}

/* ── Sidebar ── */
.sidebar{width:220px;flex-shrink:0;border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;background:var(--surface);transition:background .25s,border-color .25s}
.sidebar-head{padding:10px 12px 6px;flex-shrink:0;display:flex;align-items:center}
.sidebar-head-title{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);flex:1}
.feature-nav{display:flex;flex-direction:column;gap:2px;padding:4px 6px 6px;flex-shrink:0;border-bottom:1px solid var(--bd);transition:border-color .25s}
.feature-nav-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;border:none;background:transparent;color:var(--muted);cursor:pointer;text-align:left;width:100%;transition:background .15s,color .15s;font-size:.78rem;font-weight:500}
.feature-nav-item:hover{background:var(--card);color:var(--text)}
.feature-nav-item.active{background:rgba(108,111,245,.12);color:var(--accent);font-weight:600}
.feature-nav-ico{font-size:.9rem;flex-shrink:0;width:18px;text-align:center}
.feature-nav-label{flex:1}
.sidebar-head-title{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);flex:1}
.add-btn{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:4px;border:1px solid var(--bd);background:var(--card);color:var(--muted);transition:all .15s}
.add-btn:hover{border-color:var(--accent);color:var(--accent)}

.item-list{flex:1;overflow-y:auto;padding:4px 6px}
.product-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;margin:2px 0;border:1px solid transparent;transition:background .15s}
.product-item:hover{background:var(--card)}
.product-item.active{background:rgba(108,111,245,.12);border-color:rgba(108,111,245,.25)}
.product-item.active .product-name{color:var(--accent)}
.product-icon{width:26px;height:26px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:.68rem;flex-shrink:0}
.product-item.active .product-icon{background:rgba(108,111,245,.2);border:1px solid rgba(108,111,245,.35)}
.product-name{font-size:.78rem;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product-badge{font-size:.55rem;font-family:var(--mono);color:var(--dim);flex-shrink:0;padding:1px 6px;border-radius:8px;border:1px solid var(--bd)}
.product-actions{display:none;gap:2px;flex-shrink:0}
.product-item:hover .product-actions{display:flex}
.product-item:hover .product-badge{display:none}
.p-act-btn{width:16px;height:16px;border-radius:3px;border:none;background:transparent;color:var(--dim);font-size:.6rem;display:flex;align-items:center;justify-content:center;transition:color .15s}
.p-act-btn:hover{color:var(--text)}
.p-act-btn.del:hover{color:var(--red)}
.sidebar-admin-actions{padding:6px 8px;border-top:1px solid var(--bd);flex-shrink:0;display:flex;flex-direction:column;gap:4px}
.sidebar-admin-actions .add-inline-btn{font-size:.68rem;font-weight:600;padding:5px 12px;border-radius:6px;border:1px dashed var(--bd);background:transparent;color:var(--muted);width:100%;text-align:left;transition:all .15s;display:flex;align-items:center;gap:6px}
.sidebar-admin-actions .add-inline-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--dim);text-align:center;padding:24px}
.main-empty .ico{font-size:2rem;margin-bottom:8px}
.main-empty p{font-size:.75rem;line-height:1.6;max-width:220px}

/* Product detail header */
.detail-header{padding:14px 18px 12px;border-bottom:1px solid var(--bd);flex-shrink:0;display:flex;align-items:center;gap:12px;transition:border-color .25s}
.detail-avatar{width:38px;height:38px;border-radius:50%;background:rgba(108,111,245,.15);border:1px solid rgba(108,111,245,.3);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--accent);flex-shrink:0}
.detail-name{font-size:.95rem;font-weight:800;letter-spacing:-.01em}
.detail-sub{font-size:.68rem;color:var(--muted);margin-top:1px;transition:color .25s}
.detail-spacer{flex:1}
.detail-actions{display:flex;gap:6px;align-items:center}
.icon-btn{width:28px;height:28px;border-radius:5px;border:1px solid var(--bd);background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:.8rem;transition:all .15s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn.danger:hover{border-color:var(--red);color:var(--red)}

/* Tabs */
.tab-bar{display:flex;border-bottom:1px solid var(--bd);flex-shrink:0;transition:border-color .25s;padding:0 18px}
.tab-btn{padding:10px 18px;font-size:.78rem;font-weight:600;color:var(--muted);border:none;background:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{flex:1;overflow-y:auto;padding:14px 18px}

/* Version card */
.version-card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:10px;transition:border-color .15s}
.version-card:hover{border-color:var(--accent)}
.version-card-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.version-num{font-size:.9rem;font-weight:800;color:var(--accent)}
.version-status{font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.05em}
.status-active{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3);color:var(--green)}
.status-draft{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);color:var(--gold)}
.status-archived{background:rgba(148,148,184,.08);border:1px solid var(--bd);color:var(--dim)}
.version-date{font-size:.65rem;color:var(--dim);margin-left:auto;font-family:var(--mono)}
.version-content{font-size:.78rem;color:var(--muted);line-height:1.65;white-space:pre-wrap;max-height:120px;overflow:hidden;position:relative}
.version-content.expanded{max-height:none}
.version-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.va-btn{font-size:.68rem;font-weight:600;padding:4px 12px;border-radius:6px;border:1px solid var(--bd);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.va-btn:hover{border-color:var(--accent);color:var(--accent)}
.va-btn.set-active{border-color:rgba(52,211,153,.4);color:var(--green)}
.va-btn.set-active:hover{background:rgba(52,211,153,.1)}
.va-btn.del:hover{border-color:var(--red);color:var(--red)}
.version-expand{font-size:.68rem;color:var(--accent);cursor:pointer;border:none;background:none;padding:0;margin-top:4px;font-weight:600}

/* Empty state inside tab */
.tab-empty{text-align:center;color:var(--dim);font-size:.78rem;padding:40px 0}
.tab-empty .ico{font-size:1.5rem;margin-bottom:8px}

/* Badge summary */
.summary-row{display:flex;gap:12px;padding:10px 18px;border-bottom:1px solid var(--bd);flex-shrink:0;transition:border-color .25s;flex-wrap:wrap}
.summary-badge{font-size:.68rem;font-weight:600;padding:3px 10px;border-radius:8px;display:flex;align-items:center;gap:4px}
.summary-badge .count{font-family:var(--mono);font-weight:700}
.sb-active{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.25);color:var(--green)}
.sb-draft{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.25);color:var(--gold)}
.sb-archived{background:rgba(148,148,184,.08);border:1px solid var(--bd);color:var(--dim)}

/* ── Hamburger ── */
.hamburger-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--text);font-size:16px;cursor:pointer;display:none;align-items:center;justify-content:center;flex-shrink:0}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:49}
.sidebar-overlay.open{display:block}

@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .25s ease,background .25s;width:260px}
  .sidebar.mobile-open{transform:translateX(0)}
  .nav{position:relative;z-index:51;padding:8px 12px;gap:8px}
  .hamburger-btn{display:flex}
  .tab-btn{padding:8px 12px;font-size:.72rem}
  .tab-content{padding:10px 12px}
  .detail-header{padding:10px 12px}
  .summary-row{padding:8px 12px}
}
@media(max-width:640px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:210px;flex-shrink:0;border-right:none;border-top:1px solid var(--bd);order:2}
  .main{order:1}
}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
</style>
</head>
<body>

<!-- Modal -->
<div id="modal" class="modal hidden">
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal-box">
    <div class="modal-head">
      <span class="modal-title" id="modalTitle">—</span>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn-cancel" id="modalCancel">Batal</button>
      <button class="btn-save" id="modalSave">Simpan</button>
    </div>
  </div>
</div>

<!-- Nav -->
<nav class="nav">
  <a href="../index.html" class="theme-btn" title="Kembali ke beranda" style="font-size:12px;text-decoration:none">←</a>
  <button class="hamburger-btn" id="sidebarToggle">☰</button>
  <span class="nav-title">Kelola TOS & SLA</span>
  <span class="nav-spacer"></span>
  <button class="theme-btn" id="syncBtn" title="Sync dari server">↻</button>
  <button class="theme-btn" id="themeBtn" title="Ganti tema">🌙</button>
</nav>

<!-- App -->
<div class="app">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="sidebar">
    <div class="sidebar-head">
      <span class="sidebar-head-title">Produk / Jasa</span>
      <button class="add-btn" id="btnAddProduct" title="Tambah Produk">＋</button>
    </div>
    <div class="feature-nav">
      <button class="feature-nav-item active" id="navAll">
        <span class="feature-nav-ico">📦</span>
        <span class="feature-nav-label">Semua Produk</span>
      </button>
    </div>
    <div class="item-list" id="productList"></div>
  </div>

  <div class="main">
    <!-- All products view -->
    <div id="allProductsView" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
      <div class="main-empty">
        <div class="ico">📦</div>
        <p>Pilih produk atau buat baru untuk mengelola TOS & SLA.</p>
      </div>
    </div>

    <!-- Product detail view -->
    <div id="productDetailView" style="display:none;flex-direction:column;flex:1;overflow:hidden">
      <div class="detail-header" id="detailHeader"></div>
      <div class="summary-row" id="summaryRow"></div>
      <div class="tab-bar" id="tabBar">
        <button class="tab-btn active" data-tab="tos">📄 TOS</button>
        <button class="tab-btn" data-tab="sla">📋 SLA</button>
      </div>
      <div class="tab-content" id="tabContent"></div>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════
   CONFIG
══════════════════════════════════════════ */
const LS_KEY = 'tos_sla_data_v1';
const GIST_ID   = '6bf5ebb0397393324168d3dd14c018c8';
const GIST_FILE = 'alteco-data.json';
const WORKER_URL= 'https://alteco-writer.dionisiusn1.workers.dev';

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let db = { products: [], tosVersions: [], slaVersions: [] };
let activeProductId = null;
let activeTab = 'tos'; /* 'tos' | 'sla' */

/* modal */
let mMode = null;
let mCtx  = null;

/* ══════════════════════════════════════════
   PERSISTENCE
══════════════════════════════════════════ */
function touch(item) { item.updatedAt = Date.now(); return item; }

function migrate(d) {
  if (!d.products) d.products = [];
  if (!d.tosVersions) d.tosVersions = [];
  if (!d.slaVersions) d.slaVersions = [];
  return d;
}

function localLoad() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY));
    if (d && d.products) return migrate(d);
  } catch {}
  return null;
}

function mergeArr(a = [], b = []) {
  const map = new Map();
  for (const item of a) map.set(item.id, item);
  for (const item of b) {
    const ex = map.get(item.id);
    if (!ex || (item.updatedAt || 0) >= (ex.updatedAt || 0)) map.set(item.id, item);
  }
  const bIds = new Set(b.map(x => x.id));
  return [
    ...b.map(x => map.get(x.id)).filter(Boolean),
    ...[...map.values()].filter(x => !bIds.has(x.id)),
  ];
}

function mergeDb(gist, local) {
  return {
    products: mergeArr(gist.products || [], local.products || []),
    tosVersions: mergeArr(gist.tosVersions || [], local.tosVersions || []),
    slaVersions: mergeArr(gist.slaVersions || [], local.slaVersions || []),
  };
}

async function gistLoad() {
  const r = await fetch(`https://api.github.com/gists/${GIST_ID}`, { cache: 'no-store', headers: { 'Accept': 'application/vnd.github+json' } });
  if (!r.ok) throw new Error('gist ' + r.status);
  const gist = await r.json();
  const content = gist.files[GIST_FILE]?.content;
  if (!content) return null;
  const d = JSON.parse(content);
  if (d && d.products) return migrate(d);
  return null;
}

let _saveTimer = null;
function save() {
  localStorage.setItem(LS_KEY, JSON.stringify(db));
  if (!WORKER_URL) return;
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => _doSave(), 300);
}
async function _doSave() {
  try {
    await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(db)
    });
  } catch (e) { console.warn('Save failed', e); }
}
window.addEventListener('beforeunload', () => {
  if (!WORKER_URL) return;
  clearTimeout(_saveTimer);
  navigator.sendBeacon(WORKER_URL, new Blob([JSON.stringify(db)], { type: 'application/json' }));
});

async function syncFromGist() {
  const btn = document.getElementById('syncBtn');
  if (btn) { btn.style.opacity = '.4'; btn.disabled = true; }
  try {
    const remote = await gistLoad();
    if (remote) {
      db = mergeDb(remote, db);
      localStorage.setItem(LS_KEY, JSON.stringify(db));
      renderAll();
    }
  } catch {}
  finally { if (btn) { btn.style.opacity = ''; btn.disabled = false; } }
}

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
(async function init() {
  const local = localLoad();
  try {
    const remote = await gistLoad();
    if (remote && local) db = mergeDb(remote, local);
    else db = remote || local || { products: [], tosVersions: [], slaVersions: [] };
  } catch {
    db = local || { products: [], tosVersions: [], slaVersions: [] };
  }
  renderAll();
})();

/* ══════════════════════════════════════════
   THEME
══════════════════════════════════════════ */
(function () {
  const btn = document.getElementById('themeBtn'), html = document.documentElement;
  if (localStorage.getItem('theme') === 'light') { html.setAttribute('data-theme', 'light'); btn.textContent = '☀️'; }
  btn.addEventListener('click', () => {
    if (html.getAttribute('data-theme') === 'light') { html.removeAttribute('data-theme'); btn.textContent = '🌙'; localStorage.setItem('theme', 'dark'); }
    else { html.setAttribute('data-theme', 'light'); btn.textContent = '☀️'; localStorage.setItem('theme', 'light'); }
  });
})();

/* ── Sync button ── */
document.getElementById('syncBtn').addEventListener('click', syncFromGist);

/* ── Mobile sidebar ── */
(function () {
  const toggle = document.getElementById('sidebarToggle');
  const sidebar = document.querySelector('.sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if (!toggle || !sidebar || !overlay) return;
  function openSidebar() { sidebar.classList.add('mobile-open'); overlay.classList.add('open'); }
  function closeSidebar() { sidebar.classList.remove('mobile-open'); overlay.classList.remove('open'); }
  toggle.addEventListener('click', openSidebar);
  overlay.addEventListener('click', closeSidebar);
  sidebar.querySelectorAll('.feature-nav-item, .product-item, .add-inline-btn').forEach(el => {
    el.addEventListener('click', () => { if (window.innerWidth <= 768) closeSidebar(); });
  });
})();

/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function fmtDate(ts) {
  if (!ts) return '-';
  return new Date(ts).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function productTOS(pid) { return db.tosVersions.filter(v => v.productId === pid && !v.deleted); }
function productSLA(pid) { return db.slaVersions.filter(v => v.productId === pid && !v.deleted); }
function nextVersion(arr) {
  if (!arr.length) return 1;
  return Math.max(...arr.map(v => v.version)) + 1;
}

/* ══════════════════════════════════════════
   RENDER
══════════════════════════════════════════ */
function renderAll() {
  renderSidebar();
  if (activeProductId) renderProductDetail();
  else renderAllProducts();
}

function renderSidebar() {
  const list = document.getElementById('productList');
  list.innerHTML = '';
  const products = db.products.filter(p => !p.deleted).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'id'));
  products.forEach(p => {
    const tosCount = productTOS(p.id).length;
    const slaCount = productSLA(p.id).length;
    const div = document.createElement('div');
    div.className = 'product-item' + (activeProductId === p.id ? ' active' : '');
    div.innerHTML = `
      <div class="product-icon">📦</div>
      <span class="product-name">${esc(p.name)}</span>
      <span class="product-badge">${tosCount}T / ${slaCount}S</span>
      <span class="product-actions">
        <button class="p-act-btn" data-edit="${p.id}" title="Edit">✎</button>
        <button class="p-act-btn del" data-del="${p.id}" title="Hapus">✕</button>
      </span>
    `;
    div.addEventListener('click', (e) => {
      if (e.target.closest('.p-act-btn')) return;
      activeProductId = p.id;
      renderAll();
      closeSidebarMobile();
    });
    div.querySelector('[data-edit]')?.addEventListener('click', (e) => { e.stopPropagation(); openModal('product-edit', { id: p.id }); });
    div.querySelector('[data-del]')?.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!confirm(`Hapus produk "${p.name}" beserta semua versi TOS & SLA?`)) return;
      const tosIds = productTOS(p.id).map(v => v.id);
      const slaIds = productSLA(p.id).map(v => v.id);
      db.tosVersions.filter(v => tosIds.includes(v.id)).forEach(v => touch(Object.assign(v, { deleted: true })));
      db.slaVersions.filter(v => slaIds.includes(v.id)).forEach(v => touch(Object.assign(v, { deleted: true })));
      touch(Object.assign(p, { deleted: true }));
      if (activeProductId === p.id) activeProductId = null;
      save(); renderAll();
    });
    list.appendChild(div);
  });
}

function renderAllProducts() {
  document.getElementById('allProductsView').style.display = 'flex';
  document.getElementById('productDetailView').style.display = 'none';
  document.getElementById('navAll').classList.add('active');
}

function renderProductDetail() {
  document.getElementById('allProductsView').style.display = 'none';
  document.getElementById('productDetailView').style.display = 'flex';
  document.getElementById('navAll').classList.remove('active');

  const p = db.products.find(x => x.id === activeProductId && !x.deleted);
  if (!p) { activeProductId = null; renderAllProducts(); return; }

  /* Header */
  const hdr = document.getElementById('detailHeader');
  hdr.innerHTML = `
    <div class="detail-avatar">📦</div>
    <div>
      <div class="detail-name">${esc(p.name)}</div>
      <div class="detail-sub">${esc(p.description || 'Tidak ada deskripsi')} ${p.category ? '· ' + esc(p.category) : ''}</div>
    </div>
    <div class="detail-spacer"></div>
    <div class="detail-actions">
      <button class="icon-btn" id="detailEditBtn" title="Edit produk">✎</button>
      <button class="icon-btn danger" id="detailDelBtn" title="Hapus produk">✕</button>
    </div>
  `;
  document.getElementById('detailEditBtn').addEventListener('click', () => openModal('product-edit', { id: p.id }));
  document.getElementById('detailDelBtn').addEventListener('click', () => {
    if (!confirm(`Hapus produk "${p.name}" beserta semua versi?`)) return;
    db.tosVersions.filter(v => v.productId === p.id).forEach(v => touch(Object.assign(v, { deleted: true })));
    db.slaVersions.filter(v => v.productId === p.id).forEach(v => touch(Object.assign(v, { deleted: true })));
    touch(Object.assign(p, { deleted: true }));
    activeProductId = null; save(); renderAll();
  });

  renderSummary();
  renderTabContent();
}

function renderSummary() {
  const row = document.getElementById('summaryRow');
  const tosArr = productTOS(activeProductId);
  const slaArr = productSLA(activeProductId);
  const tosActive = tosArr.filter(v => v.status === 'active').length;
  const tosDraft = tosArr.filter(v => v.status === 'draft').length;
  const slaActive = slaArr.filter(v => v.status === 'active').length;
  const slaDraft = slaArr.filter(v => v.status === 'draft').length;
  row.innerHTML = `
    <div class="summary-badge sb-active">📄 TOS Active: <span class="count">${tosActive}</span></div>
    <div class="summary-badge sb-draft">📄 TOS Draft: <span class="count">${tosDraft}</span></div>
    <div class="summary-badge sb-active">📋 SLA Active: <span class="count">${slaActive}</span></div>
    <div class="summary-badge sb-draft">📋 SLA Draft: <span class="count">${slaDraft}</span></div>
  `;
}

/* ── Tab system ── */
document.getElementById('tabBar').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('#tabBar .tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeTab = btn.dataset.tab;
  renderTabContent();
});

function renderTabContent() {
  const container = document.getElementById('tabContent');
  const versions = activeTab === 'tos' ? productTOS(activeProductId) : productSLA(activeProductId);
  const sorted = [...versions].sort((a, b) => b.version - a.version);
  const typeLabel = activeTab === 'tos' ? 'TOS' : 'SLA';

  if (!sorted.length) {
    container.innerHTML = `
      <div class="tab-empty">
        <div class="ico">${activeTab === 'tos' ? '📄' : '📋'}</div>
        <p>Belum ada versi ${typeLabel}. Klik tombol di bawah untuk membuat yang pertama.</p>
        <button class="va-btn" style="margin-top:12px;border-color:var(--accent);color:var(--accent)" id="emptyAddBtn">＋ Tambah ${typeLabel} Pertama</button>
      </div>
    `;
    document.getElementById('emptyAddBtn')?.addEventListener('click', () => openModal('version-add', { type: activeTab }));
    return;
  }

  container.innerHTML = '';
  sorted.forEach(v => {
    const card = document.createElement('div');
    card.className = 'version-card';
    const statusClass = v.status === 'active' ? 'status-active' : v.status === 'draft' ? 'status-draft' : 'status-archived';
    card.innerHTML = `
      <div class="version-card-head">
        <span class="version-num">v${v.version}</span>
        <span class="version-status ${statusClass}">${v.status}</span>
        <span class="version-date">${fmtDate(v.createdAt || v.updatedAt)}</span>
      </div>
      <div class="version-content" id="vc-${v.id}">${esc(v.content || '(kosong)')}</div>
      ${(v.content || '').length > 200 ? `<button class="version-expand" data-toggle="${v.id}">Tampilkan lebih</button>` : ''}
      <div class="version-actions">
        ${v.status === 'draft' ? `<button class="va-btn set-active" data-activate="${v.id}">✓ Set Active</button>` : ''}
        ${v.status === 'archived' ? `<button class="va-btn" data-reactivate="${v.id}">↻ Reactivate (Draft)</button>` : ''}
        ${v.status !== 'archived' ? `<button class="va-btn" data-edit-ver="${v.id}">✎ Edit</button>` : ''}
        <button class="va-btn del" data-del-ver="${v.id}">✕ Hapus</button>
      </div>
    `;
    container.appendChild(card);

    /* expand/collapse */
    card.querySelector('[data-toggle]')?.addEventListener('click', (e) => {
      const vc = document.getElementById('vc-' + e.target.dataset.toggle);
      if (vc.classList.contains('expanded')) { vc.classList.remove('expanded'); e.target.textContent = 'Tampilkan lebih'; }
      else { vc.classList.add('expanded'); e.target.textContent = 'Sembunyikan'; }
    });

    /* activate */
    card.querySelector('[data-activate]')?.addEventListener('click', () => {
      const arr = activeTab === 'tos' ? db.tosVersions : db.slaVersions;
      arr.filter(x => x.productId === activeProductId && x.status === 'active' && !x.deleted).forEach(x => { x.status = 'archived'; touch(x); });
      v.status = 'active'; touch(v);
      save(); renderSummary(); renderTabContent();
    });

    /* reactivate */
    card.querySelector('[data-reactivate]')?.addEventListener('click', () => {
      v.status = 'draft'; touch(v);
      save(); renderSummary(); renderTabContent();
    });

    /* edit */
    card.querySelector('[data-edit-ver]')?.addEventListener('click', () => openModal('version-edit', { id: v.id, type: activeTab }));

    /* delete */
    card.querySelector('[data-del-ver]')?.addEventListener('click', () => {
      if (!confirm(`Hapus versi ${v.version}?`)) return;
      touch(Object.assign(v, { deleted: true }));
      save(); renderSummary(); renderTabContent();
    });
  });
}

function closeSidebarMobile() {
  if (window.innerWidth <= 768) {
    document.querySelector('.sidebar')?.classList.remove('mobile-open');
    document.getElementById('sidebarOverlay')?.classList.remove('open');
  }
}

/* ══════════════════════════════════════════
   MODAL
══════════════════════════════════════════ */
const modal = document.getElementById('modal');
const modalOverlay = document.getElementById('modalOverlay');
const modalClose = document.getElementById('modalClose');
const modalCancel = document.getElementById('modalCancel');
const modalSave = document.getElementById('modalSave');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');

function openModal(mode, ctx) {
  mMode = mode;
  mCtx = ctx || {};
  modalBody.innerHTML = '';

  if (mode === 'product-add') {
    modalTitle.textContent = 'Tambah Produk / Jasa';
    modalBody.innerHTML = `
      <div class="form-group"><label class="form-label">Nama Produk</label><input class="form-input" id="mName" placeholder="Contoh: Odoo ERP"></div>
      <div class="form-group"><label class="form-label">Deskripsi</label><textarea class="form-textarea" id="mDesc" rows="2" placeholder="Deskripsi singkat..."></textarea></div>
      <div class="form-group"><label class="form-label">Kategori</label><input class="form-input" id="mCat" placeholder="Contoh: Software, Konsultasi, Training"></div>
    `;
  }
  else if (mode === 'product-edit') {
    const p = db.products.find(x => x.id === mCtx.id);
    if (!p) return;
    modalTitle.textContent = 'Edit Produk';
    modalBody.innerHTML = `
      <div class="form-group"><label class="form-label">Nama Produk</label><input class="form-input" id="mName" value="${esc(p.name)}"></div>
      <div class="form-group"><label class="form-label">Deskripsi</label><textarea class="form-textarea" id="mDesc" rows="2">${esc(p.description || '')}</textarea></div>
      <div class="form-group"><label class="form-label">Kategori</label><input class="form-input" id="mCat" value="${esc(p.category || '')}"></div>
    `;
  }
  else if (mode === 'version-add') {
    const typeLabel = mCtx.type === 'tos' ? 'TOS' : 'SLA';
    const arr = mCtx.type === 'tos' ? db.tosVersions : db.slaVersions;
    const next = nextVersion(arr.filter(v => v.productId === activeProductId));
    modalTitle.textContent = `Tambah ${typeLabel} v${next}`;
    modalBody.innerHTML = `
      <div class="form-group"><label class="form-label">Konten ${typeLabel}</label><textarea class="form-textarea" id="mContent" rows="8" placeholder="Tulis konten ${typeLabel} di sini..."></textarea></div>
    `;
  }
  else if (mode === 'version-edit') {
    const arr = mCtx.type === 'tos' ? db.tosVersions : db.slaVersions;
    const v = arr.find(x => x.id === mCtx.id);
    if (!v) return;
    const typeLabel = mCtx.type === 'tos' ? 'TOS' : 'SLA';
    modalTitle.textContent = `Edit ${typeLabel} v${v.version}`;
    modalBody.innerHTML = `
      <div class="form-group"><label class="form-label">Konten ${typeLabel}</label><textarea class="form-textarea" id="mContent" rows="8">${esc(v.content || '')}</textarea></div>
    `;
  }

  modal.classList.remove('hidden');
  setTimeout(() => modalBody.querySelector('input,textarea')?.focus(), 100);
}

function closeModal() { modal.classList.add('hidden'); mMode = null; mCtx = null; }
modalOverlay.addEventListener('click', closeModal);
modalClose.addEventListener('click', closeModal);
modalCancel.addEventListener('click', closeModal);

modalSave.addEventListener('click', () => {
  if (mMode === 'product-add') {
    const name = document.getElementById('mName')?.value?.trim();
    const desc = document.getElementById('mDesc')?.value?.trim();
    const cat = document.getElementById('mCat')?.value?.trim();
    if (!name) { document.getElementById('mName').style.borderColor = 'var(--red)'; return; }
    db.products.push(touch({ id: uid(), name, description: desc || '', category: cat || '', createdAt: Date.now() }));
    save(); closeModal(); renderSidebar();
  }
  else if (mMode === 'product-edit') {
    const p = db.products.find(x => x.id === mCtx.id);
    if (!p) return;
    const name = document.getElementById('mName')?.value?.trim();
    if (!name) { document.getElementById('mName').style.borderColor = 'var(--red)'; return; }
    p.name = name;
    p.description = document.getElementById('mDesc')?.value?.trim() || '';
    p.category = document.getElementById('mCat')?.value?.trim() || '';
    touch(p);
    save(); closeModal(); renderSidebar(); renderProductDetail();
  }
  else if (mMode === 'version-add') {
    const content = document.getElementById('mContent')?.value?.trim();
    if (!content) { document.getElementById('mContent').style.borderColor = 'var(--red)'; return; }
    const arr = mCtx.type === 'tos' ? db.tosVersions : db.slaVersions;
    const next = nextVersion(arr.filter(v => v.productId === activeProductId));
    arr.push(touch({
      id: uid(),
      productId: activeProductId,
      version: next,
      content,
      status: next === 1 ? 'active' : 'draft',
      createdAt: Date.now()
    }));
    save(); closeModal(); renderSummary(); renderTabContent(); renderSidebar();
  }
  else if (mMode === 'version-edit') {
    const arr = mCtx.type === 'tos' ? db.tosVersions : db.slaVersions;
    const v = arr.find(x => x.id === mCtx.id);
    if (!v) return;
    const content = document.getElementById('mContent')?.value?.trim();
    if (!content) { document.getElementById('mContent').style.borderColor = 'var(--red)'; return; }
    v.content = content;
    touch(v);
    save(); closeModal(); renderTabContent();
  }
});

/* ── Add product buttons ── */
document.getElementById('btnAddProduct').addEventListener('click', () => openModal('product-add'));
document.getElementById('navAll').addEventListener('click', () => {
  activeProductId = null;
  renderAll();
});

/* Keyboard: Escape closes modal */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
});
</script>
</body>
